<!-- HEADER -->

<header>

    <table width="100%">

        <tr>

            <td>
                <h1>🎮 LUNAR GAMING</h1>
            </td>

            <td align="right">

                <a href="index.html">HOME</a>

                <a href="about.html">ABOUT</a>

                <a href="services.html">SERVICES</a>

            </td>

        </tr>

    </table>

    <hr>

</header>


<!-- ENQUIRY -->

<main>

    <h2 align="center">MAKE AN ENQUIRY</h2>

    <p align="center">
        Have a question? Complete the form below.
    </p>


    <form action="#" method="post">

        <table
            width="60%"
            align="center"
            cellpadding="10">

            <tr>

                <td>
                    <label for="name">Full Name:</label>
                </td>

                <td>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>
                </td>

            </tr>


            <tr>

                <td>
                    <label for="email">Email:</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </td>

            </tr>


            <tr>

                <td>
                    <label for="service">Enquiry About:</label>
                </td>

                <td>

                    <select id="service" name="service">

                        <option>Games</option>
                        <option>Gaming Services</option>
                        <option>Tournaments</option>
                        <option>Community</option>
                        <option>Other</option>

                    </select>

                </td>

            </tr>


            <tr>

                <td valign="top">
                    <label for="message">Message:</label>
                </td>

                <td>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="30"
                        required>
                    </textarea>

                </td>

            </tr>


            <tr>

                <td></td>

                <td>

                    <input
                        type="submit"
                        value="SEND ENQUIRY">

                    <input
                        type="reset"
                        value="CLEAR">

                </td>

            </tr>

        </table>

    </form>

</main>
